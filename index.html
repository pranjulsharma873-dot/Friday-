<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="FRIDAY AI Assistant"
    >

    <title>FRIDAY AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <button
            class="menu-btn"
            id="menuButton"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>


        <div class="title">
            FRIDAY AI
        </div>


        <button
            class="profile-btn"
            id="profileButton"
            type="button"
            aria-label="Profile"
        >
            👤
        </button>

    </header>



    <!-- MAIN -->

    <main class="main">


        <!-- MICROPHONE -->

        <div class="mic-container">

            <button
                class="mic-btn"
                id="micButton"
                type="button"
                aria-label="Microphone"
            >
                🎙️
            </button>

        </div>


        <div
            class="mic-status"
            id="micStatus"
        >
            Tap microphone to talk
        </div>


        <div class="voice-mode-link">

            <button
                class="voice-mode-btn"
                id="voiceModeButton"
                type="button"
            >
                🎧 Voice Mode
            </button>

        </div>



        <!-- CHAT MESSAGES -->

        <div
            id="chatMessages"
            class="chat-messages"
        ></div>



        <!-- CHAT INPUT -->

        <div class="chat-box">

            <input
                type="text"
                class="chat-input"
                id="chatInput"
                placeholder="Ask FRIDAY..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>



        <!-- BOTTOM MENU -->

        <div class="bottom-menu">

            <button
                class="bottom-btn"
                id="chatButton"
                type="button"
            >
                💬 Chat
            </button>


            <button
                class="bottom-btn"
                id="pluginsButton"
                type="button"
            >
                🧩 Plugins
            </button>


            <button
                class="bottom-btn"
                id="historyButton"
                type="button"
            >
                🕘 Chat History
            </button>


            <button
                class="bottom-btn"
                id="settingsButton"
                type="button"
            >
                ⚙️ Settings
            </button>


            <button
                class="bottom-btn"
                id="cameraButton"
                type="button"
            >
                📷 Live Cam
            </button>

        </div>

    </main>



    <!-- OVERLAY -->

    <div
        class="overlay"
        id="overlay"
    ></div>



    <!-- SIDE MENU -->

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="menu-header">

            <div class="menu-title">
                FRIDAY AI
            </div>

            <button
                class="close-btn"
                id="closeMenuButton"
                type="button"
            >
                ×
            </button>

        </div>


        <button
            class="menu-item"
            id="profileMenu"
            type="button"
        >
            👤 Profile
        </button>


        <button
            class="menu-item"
            id="newChatButton"
            type="button"
        >
            💬 New Chat
        </button>


        <button
            class="menu-item"
            id="historyMenu"
            type="button"
        >
            🕘 Chat History
        </button>


        <button
            class="menu-item"
            id="pluginsMenu"
            type="button"
        >
            🧩 Plugins
        </button>


        <button
            class="menu-item"
            id="settingsMenu"
            type="button"
        >
            ⚙️ Settings
        </button>

    </aside>



    <!-- MODAL -->

    <div
        class="modal"
        id="modal"
    >

        <h2 id="modalTitle">
            FRIDAY AI
        </h2>

        <p id="modalText">
            Welcome to FRIDAY AI.
        </p>

        <button
            class="modal-close"
            id="modalClose"
            type="button"
        >
            Close
        </button>

    </div>



    <!-- VOICE MODE (FULL SCREEN) -->

    <div
        class="voice-mode"
        id="voiceMode"
    >

        <div class="voice-mode-top">

            <button
                class="voice-mode-icon-btn"
                id="voiceModeMinimize"
                type="button"
                aria-label="Minimize"
            >
                ⌄
            </button>

        </div>


        <div class="voice-orb-wrap">

            <div
                class="voice-orb"
                id="voiceOrb"
            ></div>

        </div>


        <div
            class="voice-mode-status"
            id="voiceModeStatus"
        >
            Tap the mic to start
        </div>


        <div class="voice-mode-bottom">

            <button
                class="voice-mode-icon-btn"
                id="voiceModeMute"
                type="button"
                aria-label="Mute microphone"
            >
                🎙️
            </button>


            <button
                class="voice-mode-icon-btn voice-mode-close"
                id="voiceModeClose"
                type="button"
                aria-label="Close voice mode"
            >
                ✕
            </button>

        </div>

    </div>



    <!-- LIVE CAMERA (FULL SCREEN) -->

    <div
        class="camera-mode"
        id="cameraMode"
    >

        <video
            id="cameraVideo"
            class="camera-video"
            autoplay
            playsinline
            muted
        ></video>

        <canvas
            id="cameraCanvas"
            style="display: none;"
        ></canvas>


        <div class="camera-top">

            <button
                class="voice-mode-icon-btn camera-close"
                id="cameraCloseButton"
                type="button"
                aria-label="Close camera"
            >
                ✕
            </button>

        </div>


        <div
            class="camera-status"
            id="cameraStatus"
        >
            Point the camera and ask FRIDAY
        </div>


        <div class="camera-bottom">

            <input
                type="text"
                id="cameraQuestionInput"
                class="camera-question-input"
                placeholder="What do you want to ask? (optional)"
                autocomplete="off"
            >

            <button
                class="camera-capture-btn"
                id="cameraCaptureButton"
                type="button"
                aria-label="Capture and ask"
            >
                📸
            </button>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>

</body>

</html>
