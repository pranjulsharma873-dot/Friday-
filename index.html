<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Zarvis AI Assistant"
    >

    <title>Zarvis AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">


        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <button
                class="new-chat"
                onclick="newChat()"
            >
                ＋ New Chat
            </button>


            <div class="history">

                <p>Python Learning</p>

                <p>My AI Project</p>

                <p>Machine Learning</p>

            </div>

        </aside>


        <!-- ================= MAIN CHAT ================= -->

        <main class="chat">


            <!-- TOP BAR -->

            <header class="topbar">

                <div class="logo">

                    🤖

                    <span>
                        Zarvis
                    </span>

                </div>

            </header>


            <!-- ================= MESSAGES ================= -->

            <section
                class="messages"
                id="messages"
            >


                <!-- AI WELCOME MESSAGE -->

                <div class="message ai">

                    <div class="avatar">
                        🤖
                    </div>

                    <div class="text">

                        <div>
                            Hello 👋
                        </div>

                        <div>
                            Main tumhara AI assistant hoon.
                        </div>

                    </div>

                </div>


            </section>


            <!-- ================= INPUT AREA ================= -->

            <footer class="input-area">


                <div class="input-box">


                    <input
                        type="text"
                        id="input"
                        placeholder="Message Zarvis..."
                        autocomplete="off"
                        onkeydown="handleEnter(event)"
                    >
                    <button 
                        class="mic-button"
                        onclick="startListening()" 
                        aria-label="Voice input">🎤
                    </button>

                    <button
                        class="send-button"
                        onclick="sendMessage()"
                        aria-label="Send message"
                    >
                        ➤
                    </button>


                </div>


                <div class="footer-text">

                    Zarvis AI

                </div>


            </footer>


        </main>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>


</body>

</html>
