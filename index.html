<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="FRIDAY AI Assistant"
    >

    <title>FRIDAY AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =================================
         HEADER
    ================================== -->

    <header class="header">

        <button
            class="menu-btn"
            onclick="openMenu()"
            aria-label="Open menu"
        >
            ☰
        </button>


        <div class="title">
            FRIDAY AI
        </div>


        <button
            class="profile-btn"
            onclick="openModal('profile')"
            aria-label="Profile"
        >
            👤
        </button>

    </header>



    <!-- =================================
         MAIN
    ================================== -->

    <main class="main">


        <!-- MICROPHONE -->

        <div class="mic-container">

            <button
                class="mic-btn"
                id="micButton"
                onclick="startMic()"
                aria-label="Microphone"
            >
                🎙️
            </button>

        </div>


        <!-- MIC STATUS -->

        <div
            class="mic-status"
            id="micStatus"
        >
            Tap microphone to talk
        </div>



        <!-- =================================
             CHAT MESSAGES
        ================================== -->

        <div
            id="chatMessages"
            class="chat-messages"
        ></div>



        <!-- =================================
             CHAT INPUT
        ================================== -->

        <div class="chat-box">

            <input
                type="text"
                class="chat-input"
                id="chatInput"
                placeholder="Ask FRIDAY..."
                autocomplete="off"
                onkeydown="handleEnter(event)"
            >


            <button
                class="send-btn"
                onclick="sendMessage()"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>



        <!-- =================================
             BOTTOM MENU
        ================================== -->

        <div class="bottom-menu">


            <button
                class="bottom-btn"
                onclick="openModal('chat')"
            >
                💬 Chat
            </button>


            <button
                class="bottom-btn"
                onclick="openModal('plugins')"
            >
                🧩 Plugins
            </button>


            <button
                class="bottom-btn"
                onclick="openModal('history')"
            >
                🕘 Chat History
            </button>


            <button
                class="bottom-btn"
                onclick="openModal('settings')"
            >
                ⚙️ Settings
            </button>

        </div>

    </main>



    <!-- =================================
         OVERLAY
    ================================== -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeMenu()"
    ></div>



    <!-- =================================
         SIDE MENU
    ================================== -->

    <aside
        class="side-menu"
        id="sideMenu"
    >


        <div class="menu-header">


            <div class="menu-title">
                FRIDAY AI
            </div>


            <button
                class="close-btn"
                onclick="closeMenu()"
            >
                ×
            </button>

        </div>



        <button
            class="menu-item"
            onclick="openModal('profile')"
        >
            👤 Profile
        </button>


        <button
            class="menu-item"
            onclick="newChat()"
        >
            💬 New Chat
        </button>


        <button
            class="menu-item"
            onclick="openModal('history')"
        >
            🕘 Chat History
        </button>


        <button
            class="menu-item"
            onclick="openModal('plugins')"
        >
            🧩 Plugins
        </button>


        <button
            class="menu-item"
            onclick="openModal('settings')"
        >
            ⚙️ Settings
        </button>

    </aside>



    <!-- =================================
         MODAL
    ================================== -->

    <div
        class="modal"
        id="modal"
    >


        <h2 id="modalTitle">
            FRIDAY AI
        </h2>


        <p id="modalText">
            Welcome to FRIDAY AI.
        </p>


        <button
            class="modal-close"
            onclick="closeModal()"
        >
            Close
        </button>

    </div>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>

</body>

</html>
