<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="FRIDAY AI Assistant"
    >

    <title>FRIDAY AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <button
            class="menu-btn"
            id="menuButton"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>


        <div class="title">
            FRIDAY AI
        </div>


        <button
            class="profile-btn"
            id="profileButton"
            type="button"
            aria-label="Profile"
        >
            👤
        </button>

    </header>



    <!-- MAIN -->

    <main class="main">


        <!-- MICROPHONE -->

        <div class="mic-container">

            <button
                class="mic-btn"
                id="micButton"
                type="button"
                aria-label="Microphone"
            >
                🎙️
            </button>

        </div>


        <div
            class="mic-status"
            id="micStatus"
        >
            Tap microphone to talk
        </div>



        <!-- CHAT MESSAGES -->

        <div
            id="chatMessages"
            class="chat-messages"
        ></div>



        <!-- CHAT INPUT -->

        <div class="chat-box">

            <input
                type="text"
                class="chat-input"
                id="chatInput"
                placeholder="Ask FRIDAY..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>



        <!-- BOTTOM MENU -->

        <div class="bottom-menu">

            <button
                class="bottom-btn"
                id="chatButton"
                type="button"
            >
                💬 Chat
            </button>


            <button
                class="bottom-btn"
                id="pluginsButton"
                type="button"
            >
                🧩 Plugins
            </button>


            <button
                class="bottom-btn"
                id="historyButton"
                type="button"
            >
                🕘 Chat History
            </button>


            <button
                class="bottom-btn"
                id="settingsButton"
                type="button"
            >
                ⚙️ Settings
            </button>

        </div>

    </main>



    <!-- OVERLAY -->

    <div
        class="overlay"
        id="overlay"
    ></div>



    <!-- SIDE MENU -->

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="menu-header">

            <div class="menu-title">
                FRIDAY AI
            </div>

            <button
                class="close-btn"
                id="closeMenuButton"
                type="button"
            >
                ×
            </button>

        </div>


        <button
            class="menu-item"
            id="profileMenu"
            type="button"
        >
            👤 Profile
        </button>


        <button
            class="menu-item"
            id="newChatButton"
            type="button"
        >
            💬 New Chat
        </button>


        <button
            class="menu-item"
            id="historyMenu"
            type="button"
        >
            🕘 Chat History
        </button>


        <button
            class="menu-item"
            id="pluginsMenu"
            type="button"
        >
            🧩 Plugins
        </button>


        <button
            class="menu-item"
            id="settingsMenu"
            type="button"
        >
            ⚙️ Settings
        </button>

    </aside>



    <!-- MODAL -->

    <div
        class="modal"
        id="modal"
    >

        <h2 id="modalTitle">
            FRIDAY AI
        </h2>

        <p id="modalText">
            Welcome to FRIDAY AI.
        </p>

        <button
            class="modal-close"
            id="modalClose"
            type="button"
        >
            Close
        </button>

    </div>



    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>

</body>

</html>
